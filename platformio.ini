[platformio]
src_dir = firmware/src
include_dir = firmware/include
core_dir = .platformio

[env:e1001]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 33423360
board_build.partitions = firmware/partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.embed_files = assets/ca-bundle.bin
board_build.embed_txtfiles = assets/google-roots.pem
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1 -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -Ishared
lib_deps =
    zinggjm/GxEPD2@1.6.4
    adafruit/Adafruit GFX Library@1.12.1
    adafruit/Adafruit BusIO@1.17.2
    bblanchon/ArduinoJson@7.4.2
monitor_speed = 115200
upload_speed = 115200
