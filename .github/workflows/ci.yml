name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt
      - run: npm ci
      - run: .venv/bin/pio run
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python tools/preview.py
      - run: npm run build:installer
      - run: .venv/bin/python tools/package_firmware_source.py
      - run: npm run test:installer
      - run: npm run pack:check
      - run: npm pack --pack-destination build
      - uses: actions/upload-artifact@v4
        with:
          name: ntrain-installer
          path: build/ntrain-setup-*.tgz
